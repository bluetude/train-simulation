<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Symulacja pociągu – Nowy Sącz → Krynica</title>

    <style>
        body {
            font-family: monospace;
            background: #f5f5f5;
            padding: 20px;
        }
        .controls {
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            align-items: end;
        }
        .controls .full {
            grid-column: 1 / -1;
        }
        canvas {
            background: #fff;
            border: 1px solid #ccc;
        }
        label {
            display: block;
        }
        button {
            margin-right: 5px;
        }
        pre {
            background: #fff;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }
        .panel {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .gauge {
            width: 100%;
            height: 180px;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
    </style>
</head>

<body>

<h2>Symulacja pociągu: Nowy Sącz → Krynica</h2>

<div class="controls">
    <label>
        Moc silnika [W]:
        <input type="range" id="power" min="0" max="2000000" step="50000" value="600000">
        <strong><span id="powerVal">600000</span> W</strong>
    </label>

    <label>
        Hamulec T+ [N]:
        <input type="range" id="brake" min="0" max="500000" step="10000" value="0">
        <strong><span id="brakeVal">0</span> N</strong>
    </label>

    <label>
        Paliwo (masa początkowa) [kg]:
        <input type="range" id="fuelMass0" min="0" max="12000" step="500" value="8000">
        <strong><span id="fuelMass0Val">8000</span> kg</strong>
    </label>

    <label>
        Silnik spalinowy (zużycie paliwa):
        <input type="checkbox" id="fuelEnabled" checked>
    </label>

    <div class="full">
        <button id="start">START</button>
        <button id="stopBtn">STOP</button>
        <button id="reset">RESET</button>
    </div>
</div>

<h5>Kliknij w dowolnym punkcie trasy poniżej aby "teleportować" pociąg.</h5>
<canvas id="canvas" width="800" height="250"></canvas>

<div class="row" style="margin-top: 12px;">
    <div class="panel">
        <h4>Prędkościomierz</h4>
        <canvas id="speedGauge" class="gauge" width="350" height="180"></canvas>
        <div id="fuelStatus" style="margin-top: 8px;">Paliwo: 0 kg</div>
    </div>
    <div class="panel charts">
        <h4>Wykresy</h4>
        <canvas id="chartSpeed" width="350" height="120"></canvas>
        <canvas id="chartAccel" width="350" height="120"></canvas>
    </div>
</div>

<pre id="output">Kliknij START</pre>
<footer style="
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    font-size: 12px;
    color: #555;
    text-align: center;
    background: #f5f5f5;
    padding: 6px 0;
    border-top: 1px solid #ccc;
">
    Zadanie symulacyjne przygotowane na zajęcia z fizyki przez Marcina Barcza.
</footer>

<script>
    // =====================
    // PROFIL WYSOKOŚCI
    // =====================
    const elevationProfile = [
        290,292,295,298,302,307,313,320,328,337,
        347,358,370,382,395,408,420,
        415,408,400,392,385,378,372,
        368,370,374,380,387,395,
        404,414,425,437,450,
        462,475,488,502,517,
        532,548,565,580
    ];

    const segmentLength = 50000 / (elevationProfile.length - 1);

    // =====================
    // PARAMETRY FIZYCZNE
    // =====================
    const mTrain = 200000;
    const mLoco = 75000;
    let mFuel = 8000;
    let m = mTrain + mLoco + mFuel;
    const g = 9.81;
    const mu_rr = 0.002; // opór toczenia (mały)
    const mu_adh = 0.15; // przyczepność koło–szyna

    const rho = 1.2;
    const Cd = 1.8;
    const A = 10;

    const Pmax = 2000000;

    // paliwo (diesel)
    const LHV = 43e6; // J/kg
    const eta = 0.35; // sprawność

    // =====================
    // ZMIENNE SYMULACJI
    // =====================
    let x = 0;
    let v = 0;
    let t = 0;
    let dt = 0.1;
    let timer = null;

    const history = {
        t: [],
        v: [],
        a: []
    };

    // =====================
    // WYSOKOŚĆ + NACHYLENIE
    // =====================
    function height(x) {
        const i = Math.floor(x / segmentLength);
        if (i < 0) return elevationProfile[0];
        if (i >= elevationProfile.length - 1)
            return elevationProfile[elevationProfile.length - 1];

        const h1 = elevationProfile[i];
        const h2 = elevationProfile[i + 1];
        const t = (x - i * segmentLength) / segmentLength;
        return h1 + t * (h2 - h1);
    }

    function slope(x) {
        const dx = 5;
        return (height(x + dx) - height(x)) / dx;
    }

    // =====================
    // CANVAS – RYSOWANIE
    // =====================
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function drawTrain(x, y) {
        const angle = Math.atan(slope(x));

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.fillStyle = "#c00";
        ctx.fillRect(-10, -6, 20, 12);

        ctx.fillStyle = "#fff";
        ctx.fillRect(-6, -4, 4, 4);
        ctx.fillRect(2, -4, 4, 4);

        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(-6, 7, 2, 0, 2 * Math.PI);
        ctx.arc(6, 7, 2, 0, 2 * Math.PI);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const minH = Math.min(...elevationProfile);
        const maxH = Math.max(...elevationProfile);

        // Profil trasy
        ctx.beginPath();
        elevationProfile.forEach((h, i) => {
            const px = i / (elevationProfile.length - 1) * canvas.width;
            const py = canvas.height - (h - minH) / (maxH - minH) * canvas.height;
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        });
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pociąg – czerwona kropka
        const trainX = x / 50000 * canvas.width;
        const trainY = canvas.height -
            (height(x) - minH) / (maxH - minH) * canvas.height;

        // ctx.beginPath();
        // ctx.arc(trainX, trainY, 6, 0, 2 * Math.PI);
        // ctx.fillStyle = "red";
        // ctx.fill();
        drawTrain(trainX, trainY);
    }

    function computeForces(P, Tplus) {
        const alpha = slope(x);
        const Fg = m * g * alpha;
        const Ft = mu_rr * m * g;
        const Fair = 0.5 * rho * Cd * A * v * v;
        const F_power = P / Math.max(v, 0.5);
        const F_adh = mu_adh * mLoco * g;
        const Feng = Math.min(F_power, F_adh);
        const F = Feng - Fg - Ft - Fair - Tplus;
        const a = F / m;
        return { Fg, Ft, Fair, F_adh, Feng, a, Tplus };
    }

    function renderStats(forces) {
        output.textContent = `
Pozycja: ${(x/1000).toFixed(2)} km
Wysokość: ${height(x).toFixed(1)} m
Prędkość: ${(v*3.6).toFixed(1)} km/h
Przyspieszenie: ${forces.a.toFixed(3)} m/s²

Siła napędu: ${forces.Feng.toFixed(0)} N
Siły oporu: ${(forces.Fg + forces.Ft + forces.Fair + forces.Tplus).toFixed(0)} N
Limit przyczepności: ${forces.F_adh.toFixed(0)} N
Paliwo: ${mFuel.toFixed(0)} kg
`;
    }

    function refreshDisplay() {
        draw();
        drawGauge();
        drawCharts();
        const P = Math.min(+power.value, Pmax);
        const Tplus = +brake.value;
        renderStats(computeForces(P, Tplus));
    }

    // =====================
    // KROK SYMULACJI
    // =====================
    function step() {
        const P = Math.min(+power.value, Pmax);
        const Tplus = +brake.value;
        const fuelOn = fuelEnabled.checked;

        // aktualizacja masy (paliwo)
        if (fuelOn && P > 0 && mFuel > 0) {
            const mdot = P / (eta * LHV); // kg/s
            mFuel = Math.max(0, mFuel - mdot * dt);
        }
        m = mTrain + mLoco + mFuel;

        const forces = computeForces(P, Tplus);

        v += forces.a * dt;
        v = Math.max(v, 0);
        x += v * dt;

        t += dt;

        // zapisz historię (do wykresów)
        history.t.push(t);
        history.v.push(v);
        history.a.push(forces.a);
        if (history.t.length > 600) {
            history.t.shift();
            history.v.shift();
            history.a.shift();
        }

        draw();
        drawGauge();
        drawCharts();
        renderStats(forces);
    }

    // =====================
    // PRZYCISKI
    // =====================
    start.onclick = () => {
        if (!timer) {
            timer = setInterval(step, dt * 1000);
            fuelMass0.disabled = true;
        }
    };

    const stopBtn = document.getElementById("stopBtn");

    stopBtn.onclick = () => {
        clearInterval(timer);
        timer = null;
    };

    reset.onclick = () => {
        x = 0;
        v = 0;
        t = 0;
        mFuel = +fuelMass0.value;
        m = mTrain + mLoco + mFuel;
        history.t = [];
        history.v = [];
        history.a = [];
        fuelMass0.disabled = false;
        draw();
        drawGauge();
        drawCharts();
        output.textContent = "Zresetowano. Kliknij START.";
    };

    // Rysuj początkowy profil

    const powerVal = document.getElementById("powerVal");
    const brakeVal = document.getElementById("brakeVal");
    const fuelMass0Val = document.getElementById("fuelMass0Val");

    function updateSliders() {
        powerVal.textContent = (+power.value).toLocaleString("pl-PL");
        brakeVal.textContent = (+brake.value).toLocaleString("pl-PL");
        fuelMass0Val.textContent = (+fuelMass0.value).toLocaleString("pl-PL");
    }

    power.addEventListener("input", () => {
        updateSliders();
        if (!timer) refreshDisplay();
    });
    brake.addEventListener("input", () => {
        updateSliders();
        if (!timer) refreshDisplay();
    });
    fuelMass0.addEventListener("input", () => {
        updateSliders();
        if (!timer) {
            mFuel = +fuelMass0.value;
            m = mTrain + mLoco + mFuel;
            refreshDisplay();
        }
    });

    // inicjalnie
    updateSliders();

    // =====================
    // PRĘDKOŚCIOMIERZ
    // =====================
    const gauge = document.getElementById("speedGauge");
    const gctx = gauge.getContext("2d");
    const fuelStatus = document.getElementById("fuelStatus");

    function drawGauge() {
        const maxKmh = 160;
        const kmh = v * 3.6;
        const angleMin = Math.PI * 0.75;
        const angleMax = Math.PI * 2.25;
        const ratio = Math.max(0, Math.min(1, kmh / maxKmh));
        const angle = angleMin + (angleMax - angleMin) * ratio;

        gctx.clearRect(0, 0, gauge.width, gauge.height);
        gctx.fillStyle = "#fff";
        gctx.fillRect(0, 0, gauge.width, gauge.height);

        const cx = gauge.width / 2;
        const cy = gauge.height * 0.95;
        const r = gauge.height * 0.75;

        // łuk tła
        gctx.beginPath();
        gctx.arc(cx, cy, r, angleMin, angleMax);
        gctx.strokeStyle = "#ddd";
        gctx.lineWidth = 12;
        gctx.stroke();

        // łuk wartości
        gctx.beginPath();
        gctx.arc(cx, cy, r, angleMin, angle);
        gctx.strokeStyle = "#c00";
        gctx.lineWidth = 12;
        gctx.stroke();

        // wskazówka
        gctx.beginPath();
        gctx.moveTo(cx, cy);
        gctx.lineTo(cx + Math.cos(angle) * (r - 10), cy + Math.sin(angle) * (r - 10));
        gctx.strokeStyle = "#000";
        gctx.lineWidth = 3;
        gctx.stroke();

        // napis
        gctx.fillStyle = "#000";
        gctx.font = "16px monospace";
        gctx.textAlign = "center";
        gctx.fillText(`${kmh.toFixed(1)} km/h`, cx, gauge.height * 0.2);

        fuelStatus.textContent = `Paliwo: ${mFuel.toFixed(0)} kg`;
    }

    // =====================
    // WYKRESY
    // =====================
    const chartSpeed = document.getElementById("chartSpeed");
    const chartAccel = document.getElementById("chartAccel");
    const c1 = chartSpeed.getContext("2d");
    const c2 = chartAccel.getContext("2d");

    function drawChart(ctx, data, label, color, minY, maxY) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

        ctx.strokeStyle = "#ccc";
        ctx.beginPath();
        ctx.moveTo(0, ctx.canvas.height - 20);
        ctx.lineTo(ctx.canvas.width, ctx.canvas.height - 20);
        ctx.stroke();

        if (data.length < 2) {
            ctx.fillStyle = "#666";
            ctx.font = "12px monospace";
            ctx.fillText(label, 6, 14);
            return;
        }

        const w = ctx.canvas.width;
        const h = ctx.canvas.height - 20;

        ctx.beginPath();
        data.forEach((val, i) => {
            const x = (i / (data.length - 1)) * w;
            const y = h - ((val - minY) / (maxY - minY)) * h;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#000";
        ctx.font = "12px monospace";
        ctx.fillText(label, 6, 14);
    }

    function drawCharts() {
        const speedKmh = history.v.map(s => s * 3.6);
        const accel = history.a;
        drawChart(c1, speedKmh, "Prędkość [km/h]", "#0072B2", 0, 160);
        drawChart(c2, accel, "Przyspieszenie [m/s²]", "#D55E00", -1.5, 1.5);
    }

    // inicjalne odświeżenie widoku
    refreshDisplay();

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;

        // przeliczenie px → metry
        const newX = (clickX / canvas.width) * 50000;

        teleport(newX);
    });

    function teleport(newX) {
        x = Math.max(0, Math.min(newX, 50000));

        // opcja 1: zachowaj prędkość
        // v = v;

        // opcja 2 (bezpieczniejsza dydaktycznie):
        v = 0;

    draw();
    drawGauge();
    drawCharts();
        output.textContent = `
Teleportacja:
Pozycja: ${(x/1000).toFixed(2)} km
Wysokość: ${height(x).toFixed(1)} m
`;
    }
</script>

</body>
</html>
